name: Build & Publish Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & warm up OCR models
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 rapidocr onnxruntime faster-whisper PyAudioWPatch mss opencv-python pillow pyinstaller
          python -c "import numpy as np; from rapidocr import RapidOCR; eng = RapidOCR(); eng(np.zeros((80, 240, 3), dtype=np.uint8))"

      - name: Package Standalone Windows EXE
        shell: pwsh
        working-directory: desktop
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "轻译" `
            --icon "assets\anilingo.ico" `
            --distpath "dist_win" `
            --collect-data rapidocr `
            --collect-data faster_whisper `
            --collect-binaries onnxruntime `
            --collect-binaries ctranslate2 `
            --hidden-import rapidocr `
            --hidden-import faster_whisper `
            --hidden-import pyaudiowpatch `
            --hidden-import mss `
            --hidden-import cv2 `
            run_desktop.py
          Compress-Archive -Path "dist_win\轻译" -DestinationPath "..\QingYi-Windows-x64.zip" -Force

      - name: Publish Windows EXE Zip & Android APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "轻译 ${{ github.ref_name }}（极速低延迟版 · Windows EXE + Android APK）"
          body: |
            ### 更新内容
            - 桌面端本地多语种识字提速至 **~45ms**（修复宽字幕条多余放大与多核线程争用）。
            - 新增 HTTPS Keep-Alive 长连接池与启动预热，在线翻译延迟降至 **~220ms**，整体出字幕延迟压缩至 **0.3 ～ 0.5 秒**。
            - 屏幕采样间隔默认提升至 **0.22 秒**，语音停顿断句优化至 **0.32 秒**。

            ### 下载安装说明
            1. **Windows 电脑免安装便携版 (`QingYi-Windows-x64.zip`)**：下载解压后双击 `轻译/轻译.exe` 即可打开浅色控制面板使用。
            2. **Android 手机全局悬浮窗版 (`QingYi-Android.apk`)**：下载安装至 Android 手机，开启悬浮窗权限即可使用。
          files: |
            QingYi-Windows-x64.zip
            downloads/QingYi-Android.apk
